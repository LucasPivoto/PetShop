{% extends "base.html" %}
{% block title %}Cadastro{% endblock %}

{% block content %}
<div class="mx-auto max-w-xl px-4 py-12">
  <section class="cartao">
    <h1 class="titulo-pagina">Criar conta de tutor</h1>
    <p class="mt-1 text-sm text-stone-600">Leva menos de um minuto. Depois é só cadastrar o seu pet.</p>

    <form method="post" class="mt-6 grid gap-4 sm:grid-cols-2">
      {{ csrf_field() }}
      <div class="sm:col-span-2">
        <label for="nome" class="rotulo">Nome completo</label>
        <input id="nome" name="nome" required value="{{ form.nome }}" class="campo" autocomplete="name">
      </div>
      <div>
        <label for="email" class="rotulo">E-mail</label>
        <input id="email" name="email" type="email" required value="{{ form.email }}" class="campo" autocomplete="email">
      </div>
      <div>
        <label for="senha" class="rotulo">Senha <span class="font-normal text-stone-500">(mín. 6 caracteres)</span></label>
        <input id="senha" name="senha" type="password" required minlength="6" class="campo" autocomplete="new-password">
      </div>
      <div>
        <label for="telefone" class="rotulo">Telefone / WhatsApp</label>
        <input id="telefone" name="telefone" value="{{ form.telefone }}" class="campo" placeholder="(35) 9 0000-0000" autocomplete="tel">
      </div>
      <div>
        <label for="bairro" class="rotulo">Bairro</label>
        <input id="bairro" name="bairro" value="{{ form.bairro }}" class="campo" placeholder="Ex.: Centro">
      </div>
      <div class="sm:col-span-2">
        <label for="endereco_completo" class="rotulo">Endereço completo</label>
        <input id="endereco_completo" name="endereco_completo" value="{{ form.endereco_completo }}" class="campo"
               placeholder="Rua, número e complemento" autocomplete="street-address">
      </div>
      <button class="btn-primario py-3 sm:col-span-2">Criar conta</button>
    </form>

    <p class="mt-5 text-center text-sm text-stone-600">
      Já tem conta? <a href="/login" class="font-extrabold text-marca-700 hover:underline">Entrar</a>
    </p>
  </section>
</div>
{% endblock %}
