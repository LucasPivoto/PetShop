{% extends "base.html" %}
{% block title %}Meu perfil{% endblock %}

{% block content %}
<div class="mx-auto max-w-xl px-4 py-10">
  <h1 class="titulo-pagina">Meu perfil</h1>
  <p class="mt-1 text-sm text-stone-600">Estes dados preenchem o endereço do atendimento em domicílio.</p>

  <form method="post" class="cartao mt-6 grid gap-4 sm:grid-cols-2">
    {{ csrf_field() }}
    <div class="sm:col-span-2">
      <label for="nome" class="rotulo">Nome completo</label>
      <input id="nome" name="nome" required value="{{ usuario.nome }}" class="campo">
    </div>
    <div>
      <label for="email" class="rotulo">E-mail <span class="font-normal text-stone-500">(não editável)</span></label>
      <input id="email" value="{{ usuario.email }}" disabled class="campo bg-stone-100 text-stone-500">
    </div>
    <div>
      <label for="telefone" class="rotulo">Telefone / WhatsApp</label>
      <input id="telefone" name="telefone" value="{{ usuario.telefone or '' }}" class="campo">
    </div>
    <div class="sm:col-span-2">
      <label for="endereco_completo" class="rotulo">Endereço completo</label>
      <input id="endereco_completo" name="endereco_completo" value="{{ usuario.endereco_completo or '' }}" class="campo">
    </div>
    <div>
      <label for="bairro" class="rotulo">Bairro</label>
      <input id="bairro" name="bairro" value="{{ usuario.bairro or '' }}" class="campo">
    </div>
    <div class="flex items-end">
      <button class="btn-primario w-full py-3">Salvar alterações</button>
    </div>
  </form>
</div>
{% endblock %}
